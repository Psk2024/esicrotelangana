<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>List of Officers / Officials</title>
<link rel="stylesheet" href="styles.css" />
</head>

<body>

<header>
  <h1>List of Officers / Officials</h1>

  <div class="summary-cards">
    <div class="card">
      <strong id="totalCount">0</strong>
    </div>
  </div>
</header>

<main>
  <section class="controls">
    <select id="cadreSelect">
      <option value="">All Branches</option>
    </select>

    <input
      type="search"
      id="searchInput"
      placeholder="Search by ID, Name or Branch..."
    />
  </section>

  <section id="employeeTableContainer" aria-live="polite"></section>

  <div id="branchSummary"></div>
</main>

<!-- Employee Modal -->
<div id="employeeModal" class="modal">
  <div class="modal-content">
    <span class="close-btn">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script src="script.js" defer></script>
</body>
</html>
